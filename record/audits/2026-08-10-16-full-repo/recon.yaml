boundaries:
  - name: corpus-filesystem
    description: "Configuration discovery and corpus path resolution determine which summaries, Markdown files, PDFs, and cache entries are read."
    modules: [configuration-and-corpus, evidence-and-review, proposal-and-validation]
    notes: "Primary trust boundary: user-controlled identifiers and templates must remain inside the configured corpus."
  - name: external-pdf-tools
    description: "MuPDF and Tesseract subprocesses consume canonical PDFs and return structured or OCR text."
    modules: [pdf-extraction]
    notes: "Process invocation, output parsing, timeouts, and cache identity determine validation correctness."
  - name: summary-deserialization
    description: "YAML, JSON, and TOML configuration plus YAML summary evidence enter typed validation structures."
    modules: [configuration-and-corpus, evidence-and-review]
    notes: "Unknown-field policy and hash binding are the semantic integrity boundary."
  - name: agent-cli-contract
    description: "CLI Spec JSON, command output, exit codes, and shell completions expose the machine-facing integration surface."
    modules: [cli, public-library-surface]
    notes: "README promises and schema output must match runtime acceptance."
