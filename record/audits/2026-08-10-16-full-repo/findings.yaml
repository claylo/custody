    thesis: "Corpus-wide validation repeats prefix scans, subprocess probes, allocations, and candidate verification at page-and-candidate cardinality."
    verdict: "The two largest costs are structural: OCR cache hits still spawn tools, and proposal ranking verifies the entire candidate set before applying its limit. The remaining parser/allocation findings are local reductions that become worthwhile because they sit inside those repeated paths."
    flow:
