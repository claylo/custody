        label: "Corpus command"
        type: start
      - id: parse-markdown
        label: "Parse Markdown units"
        type: process
        findings:
          - slug: markdown-coordinate-resolution-rescans-prefixes
            label: "Rescan prefixes"
      - id: score-candidates
        label: "Score candidates"
        type: process
        findings:
          - slug: case-insensitive-token-check-allocates-per-comparison
            label: "Lowercase allocs"
      - id: verify-candidates
        label: "Verify against PDF"
        type: process
        findings:
