---
audit_date: 2026-08-10
scope: "Full repository audit — Rust source, tests, dependencies, configuration, and documented behavior"
commit: 3c98f512425a89876c82fe52d98d21ba33ee6a55
assessment: |
  receipts has a disciplined core: unsafe code is forbidden, Clippy and unused-dependency
  checks pass, and the advisory, license, ban, and source-policy gates are clean. Its main
  risks sit at the boundaries between validated configuration and public construction,
  between runtime output and the advertised CLI Spec, and in repeated Markdown/PDF work
  across corpus-wide commands. Eight significant findings include two invariant bypasses,
  silent proposal-source failures, contract-invalid multi-document JSON, incomplete summary
  discovery, and two scaling paths that multiply work by pages or candidates. The fixes are
  localized; the architecture does not need replacement.

narratives:
  - slug: configuration-cache-integrity
    title: "The Configuration and Cache Integrity Surface"
    thesis: "File-loaded configuration is carefully checked, but public construction and deserialization can bypass the invariants that keep corpus and cache paths contained."
    verdict: "The filesystem boundary is sound on the documented CLI path, yet the library API represents validated and unvalidated state with the same public types. Make those states unforgeable, then remove the one eager index fallback; the existing validation logic can do most of the work."
    flow:
      - id: configuration-input
        label: "Configuration input"
        type: start
