      - slug: justfile-loads-repo-supplied-dotenv
        title: "The justfile loads a repo-supplied .env into every recipe, including cargo builds"
        concern: moderate
        locations:
          - path: "justfile"
            start_line: 1
            end_line: 4
        evidence: |2
          set shell := ["bash", "-c"]
          set dotenv-load := true
          toolchain := `taplo get -f rust-toolchain.toml toolchain.channel | tr -d '"'`
          msrv := "1.89.0"
