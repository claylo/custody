          pdf path, pdf hash) instead of three parallel maps — that alone removes
          the cross-loop invariant. Then extract `validate_locator_against_sources`,
          `check_token_coverage`, and `check_weak_sections` as functions taking the
          resolved map and returning `Vec<EvidenceIssue>`.
