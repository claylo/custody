            start_line: 189
            end_line: 198
          - path: src/markdown.rs
            start_line: 19
            end_line: 32
          - path: src/review.rs
            start_line: 174
            end_line: 186
        evidence: |2
          0 => issues.push(issue(
              "markdown_missing",
              Severity::Error,
              format!(
                  "exact text does not occur in the recorded {:?} unit",
                  locator.markdown.unit
              ),
              Some(entry.claim),
              Some(locator_index),
          )),
        evidence_lang: rust
        evidence_markers:
          - lines: "5"
            type: del
            label: "`{:?}` prints `ListItem`; the schema value the user wrote is `list_item`"
          - lines: "6"
            type: mark
            label: "`UnitKind::as_str()` exists two files away and is documented for exactly this"
        mechanism: >2
          `UnitKind::as_str` carries the doc comment "The serialized name, so human
          output and JSON agree," and `PdfBackend::as_str` exists for the same reason.
          Both are used correctly at five call sites (`validate.rs:225,258,269`,
          `cli.rs:1057,1067`) and bypassed at `validate.rs:193`, where `{:?}` emits
          `ListItem`/`TableCell`/`CodeBlock` instead of the `list_item`/`table_cell`/
