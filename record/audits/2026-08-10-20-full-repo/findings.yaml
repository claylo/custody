          letters, digits, and interior hyphens, with a minimum length of three. README uses `ID`
          freely throughout the Run section and the evidence contract without ever stating the rule,
          and the sole worked example (`smith-2019`) happens to satisfy it. A corpus using
          `Smith2019`, `smith_2019`, `10.1234/xyz`, or a two-character key gets `invalid summary ID
          "..."` with no pointer to the rule it violated, and the constraint is not discoverable from
          `--help` or the CLI Spec either — the declared `invalid_id` error says only "Summary ID is
          not safe for template expansion". Adopting `receipts` against an existing corpus means
          renaming files to satisfy an unwritten rule.
        remediation: >2
          State the rule where users encounter IDs. Add one sentence to README's Evidence contract
          section — IDs are at least three characters of lowercase ASCII letters, digits, and interior
          hyphens — and widen the `bail!` in `validate_id` to name the constraint it enforced rather
          than only echoing the rejected value (e.g. "invalid summary ID {id:?}: IDs must be 3+
          characters of lowercase letters, digits, and interior hyphens"). Consider extending the
          `invalid_id` `ErrorMetadata` description in `schema_metadata()` with the same wording so
          agent integrations can pre-validate.
