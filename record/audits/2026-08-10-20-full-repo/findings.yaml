          `source: Option<String>`), the same way `claim` and `locator` are already carried as
          separate fields rather than baked into the code string. Concretely, change
          `validate_source_path` to emit `"source_mismatch"`, `validate_file_hash` to emit
          `"source_hash_mismatch"` / `"source_read_failed"`, and `validate_resolved_source` to emit
          `"source_outside_repo"` / `"source_unresolvable"`, threading `source_name` through as data.
