          all, so `review.rs:180` tells the user their verdict is `Unsupported` while
          the file they must edit says `unsupported`. None of the three enums implements
          `Display`, which is what leaves `{:?}` as the only formatting available at a
          message site and guarantees this drifts again. In a tool whose entire product
          is a precise error message pointing at a schema value, a message that names a
          value the schema does not accept sends the reader looking for the wrong string.
        remediation: >2
          Implement `Display` on `UnitKind`, `PdfBackend`, and `Verdict`, delegating to
