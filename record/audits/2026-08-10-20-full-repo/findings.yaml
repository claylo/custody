        mechanism: >2
          `set dotenv-load := true` makes `just` read `.env` from the working directory and export
          every entry into the environment of every recipe. `.env` is absent from `.gitignore` (which
          lists only `/target`, `/.cache`, `/dist`, `commit.txt`, `scratch/`, `.DS_Store`,
          `.crustoleum`), so a `.env` committed to a fork or a PR branch is present the moment the
          branch is checked out. The recipes it feeds are `cargo` invocations, and cargo reads
          execution-controlling variables straight from the environment: `RUSTC`,
          `CARGO_BUILD_RUSTC_WRAPPER`, and `CARGO_TARGET_<TRIPLE>_RUNNER` each name a binary cargo then
          executes. A `.env` containing `CARGO_BUILD_RUSTC_WRAPPER=./pwn.sh` turns `just check`,
          `just test`, or `just clippy` into arbitrary code execution on the reviewer's machine — the
          sanctioned entry points a maintainer runs first when evaluating a contribution. No recipe in
          the file reads an environment variable, so the setting buys nothing and is pure exposure. It
          arrived on 2026-08-10 in "chore: update justfile and config to match fleet baseline," which
          suggests the same line is present across the fleet's other justfiles.
        remediation: >2
          Delete line 2. No recipe references an environment variable, so removal is behaviour-neutral.
          If a future recipe needs configuration, prefer `just` variables passed on the command line
          (`just foo bar=baz`) or an explicitly named file loaded inside the one recipe that needs it.
          Add `.env` to `.gitignore` regardless, so a stray local file is never committed. Since the
          line came from a shared fleet baseline, fix it at the baseline rather than only here.
