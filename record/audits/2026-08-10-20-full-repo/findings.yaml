  - slug: type-and-api
    title: "The Type and API Surface"
    thesis: "In a tool whose entire job is to keep coordinates straight, line, column, page, and claim index are all bare usize — and the whole crate is exported as a stable-looking public API on a publishable manifest."
    verdict: "The domain's central failure mode is confusing one coordinate for another, and the type system currently offers no defence against it: every one of them is usize, and they compose and swap silently. One instance already shipped — a byte offset is renamed column in the published evidence schema, which is correct only for ASCII. The prior audit accepted the pub-surface findings on the grounds that there are no library consumers, and that reasoning is sound today; the finding here is narrower and still stands, because the manifest carries a description, keywords, categories, and a repository field, and the moment 0.1.0 is published every internal module becomes a compatibility obligation. Newtypes are the highest-leverage change on this surface and they are mechanical."
    flow:
      - id: md
        label: "Markdown source"
        type: start
      - id: index
        label: "Compute offset"
        type: process
        findings:
          - slug: byte-offset-published-as-a-markdown-column
            label: "Byte ≠ column"
      - id: locator
        label: "Build locator (usize, usize)"
        type: process
        findings:
          - slug: coordinate-primitives-are-interchangeable-usize
            label: "All bare usize"
      - id: resolve
        label: "Resolve to markdown unit"
        type: process
      - id: serialize
        label: "Serialize report"
        type: process
        findings:
          - slug: report-types-are-write-only
            label: "Serialize only"
      - id: consumer
        label: "Downstream consumer"
        type: end
    findings:
      - slug: entire-crate-is-a-published-public-api
        title: "Every internal module is exported as a stable-looking public API on a publishable crate"
        concern: advisory
        locations:
          - path: src/lib.rs
            start_line: 1
            end_line: 17
          - path: Cargo.toml
            start_line: 1
            end_line: 10
        evidence: |2
          //! Deterministic evidence validation for LLM summaries of PDF sources.

          pub mod cli;
          pub mod config;
          pub mod corpus;
          pub mod evidence;
          pub mod hash;
          pub mod markdown;
          pub mod normalize;
          pub mod output;
          pub mod pdf;
          pub mod propose;
          pub mod review;
          pub mod sections;
          pub mod terms;
          pub mod tokens;
          pub mod validate;
        evidence_lang: rust
        evidence_markers:
          - lines: "3"
            type: mark
            label: "the binary's own entry point, exported as library API"
          - lines: "9-10"
            type: mark
            label: "one-function internal helpers (normalize, print_json) exported"
          - lines: "3-17"
            type: mark
            label: "15 modules, ~240 pub items, zero re-export curation"
        mechanism: >2
          The prior audit accepted `public-apis-erase-error-types`,
          `unvalidated-discovered-state`, and `cache-manifest-invariants-are-bypassable`
          on the rationale that "there are no library consumers — the `pub` surface
          exists for internal/test convenience only." That rationale is factually
          correct and is precisely why the surface itself, not each downstream symptom,
          is the finding. `lib.rs` is a bare list of `pub mod` with no `pub use` façade
          and no `#[doc(hidden)]`, so every one of ~240 `pub` items is a load-bearing
          commitment: `cli::run`, `output::print_json`, `normalize::normalize`,
          `Corpus::from_discovered`, `CacheManifest`'s public fields, and the raw
          `Mutool`/`Tesseract` adapters are all indistinguishable to a consumer from
          the three functions that are actually the product (`validate_document`,
          `propose_document`, `parse_summary`). Meanwhile `Cargo.toml` carries full
          crates.io publish metadata (`license`, `repository`, `keywords`,
          `categories`, `description`) and no `publish = false`, so a single
          `cargo publish` turns the entire internal structure into a semver contract
          that 0.1.0 is not ready to hold. Each accepted finding is a rational local
          decision; together they describe a crate that has not decided whether it is
          a library.
        remediation: >2
          Decide the posture once and encode it. If this is a binary with a test-only
          library target, add `publish = false` to `Cargo.toml` — that one line removes
          the compatibility obligation outright and costs nothing. Module-level demotion
          buys much less than it looks: `tests/` imports 13 of the 15 modules, several at
          depth (`pdf::cache::{CacheManifest, OcrCache, OcrProfile, cache_key}`,
          `pdf::tesseract::{OcrEngine, PageRenderer, ocr_page, parse_tsv, ...}`,
          `propose::{propose_document, split_sentences}`, `validate::validate_document`,
          `normalize::normalize`), leaving only `cli` and `output` demotable as whole
          modules. The reachable win is per-item: `#[doc(hidden)]` on the test-only
          surface plus a curated `pub use` façade for the three product entry points. If
          it is a library, curate `lib.rs` into a deliberate façade — `pub use` the
          handful of entry types, mark the rest `pub(crate)` or `#[doc(hidden)]` — and
          then the three previously-accepted encapsulation findings become in-scope
          rather than moot. Either way, the choice belongs in `lib.rs` and
          `Cargo.toml`, not distributed across per-symbol judgment calls.
