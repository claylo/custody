            type: mark
            label: "six nesting levels in sixteen lines"
        mechanism: >2-
          `validate_document` runs from src/validate.rs:41 to 366 and performs nine
          separable jobs against three interleaved `BTreeMap` accumulators keyed by
          source name: source-template resolution, recorded-path comparison,
          containment checking, file hashing, Markdown unit resolution, PDF page
          extraction with memoization, required-token coverage, weak-section
          warning, and review dispatch. The excerpt shows the depth — `for` inside
          `for` inside `if let` inside `match` inside `match` inside `if` — reached
          before any of the four issue-pushing arms. `too_many_lines` is set to
          `allow` in Cargo.toml, so clippy is explicitly silenced on exactly this.
          The practical cost is that the three maps (`source_units`,
          `source_pdf_path`, `source_pdf_sha256`) are populated in one loop and read
          in another 100 lines away, with `continue` statements in the first loop
          deciding which keys the second loop will silently skip via
          `let Some(...) else { continue }` at src/validate.rs:233-235 — a
          cross-loop invariant a reader has to reconstruct by hand before they can
          change anything safely.
