      - slug: report-types-are-write-only
        title: "Every output report derives `Serialize` alone, so the crate cannot read its own JSON"
        concern: advisory
        locations:
          - path: src/propose.rs
            start_line: 21
            end_line: 36
          - path: tests/cli.rs
            start_line: 384
            end_line: 392
        evidence: |2
          /// Every claim considered for one summary, with its candidates.
          #[derive(Debug, Clone, Serialize)]
          pub struct ProposalReport {
              pub id: String,
              pub claims: Vec<ClaimProposal>,
          }

          /// Candidates offered for one claim, and the tokens none of them reach.
          #[derive(Debug, Clone, Serialize)]
          pub struct ClaimProposal {
              pub claim: usize,
              pub required_tokens: Vec<String>,
              pub uncovered_tokens: Vec<String>,
              pub advisory_tokens: Vec<String>,
              pub candidates: Vec<Candidate>,
          }
        evidence_lang: rust
        evidence_markers:
          - lines: "2"
            type: del
            label: "no `Deserialize`, no `PartialEq`"
          - lines: "9"
            type: del
            label: "same for every type in the report family"
        mechanism: >2
          `ProposalReport`, `ClaimProposal`, `Candidate`, `CoverageScore`,
          `MarkdownMatch`, `PdfMatch`, `ValidationReport`, `EvidenceIssue`, `Severity`,
          and `PdfBbox` all derive `Serialize` with no `Deserialize`. Seven of the ten —
          every type in the `propose` report family plus `ValidationReport` — also lack
          `PartialEq`; only `Severity` (src/evidence.rs:103), `EvidenceIssue`
          (src/evidence.rs:111), and `PdfBbox` (src/pdf/mod.rs:29) derive it. The schema-bearing input
          types next door (`Evidence`, `Locator`, `ClaimEvidence`, `ReviewEntry`) derive
          both directions, so the asymmetry is a per-type oversight rather than a
          policy. The cost is already visible in the crate's own suite:
          `tests/cli.rs:385` decodes `propose --format json` into an untyped
          `serde_json::Value` and asserts through string indexing
          (`report["claims"][0]["required_tokens"]`), which means a field rename in
          `ClaimProposal` breaks the JSON contract while every test still compiles and
          passes. The missing `PartialEq` on the report family compounds it — a decoded
          `ProposalReport` or `ValidationReport` still cannot be compared with
          `assert_eq!`, so round-trip tests are not expressible either.
        remediation: >2
          Add `Deserialize` and `PartialEq` to the report family. That lets
          `tests/cli.rs` decode into `ProposalReport` and assert on typed fields, turning
          a JSON schema break into a compile error, and it gives any future consumer —
          including a `receipts` invocation piped into another tool — a supported way to
