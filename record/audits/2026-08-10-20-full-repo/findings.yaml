          README's schema section promises the CLI Spec describes "every ... error code", and the
          Vocabulary section promises that "a script consuming `--format json` is portable across
          corpora" because codes are stable identifiers. Neither holds for source-file validation.
          `src/validate.rs:112-113` builds a per-source label — `format!("{source_name}/markdown")` —
