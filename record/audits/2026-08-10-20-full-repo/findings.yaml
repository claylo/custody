          making non-strict renames fallible would be silently swallowed on the output path,
          producing evidence records written under the wrong vocabulary keys. The same shape
          appears at src/hash.rs:14 (`let _ = write!(s, "{b:02x}")`), where the discard is
          infallible-by-construction for `String` but likewise unexplained. Criterion 5.3 asks for
          an explicit rationale at the discard site; neither has one.
        remediation: |2
