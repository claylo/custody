# receipts.yaml — the directory holding this file is the corpus root.
# All templates are relative to it and must contain {id}.
corpus:
  summaries: "summaries/{id}.yaml"
  markdown:
    - "md/{id}.md"
    - "md/{id}/{id}.md"
  pdf: "pdfs/{id}.pdf"

cache:
  # null uses the platform cache directory
  # (~/Library/Caches/receipts/pdf-text on macOS).
  # Set a path to keep extraction artifacts beside the corpus.
  root: null

pdf:
  tools:
    # null resolves the executable from PATH once at startup. Set an absolute
    # path to pin the exact binary.
    mutool: null
    tesseract: null
  ocr:
    enabled: true
    dpi: 300
    lang: eng

terms:
  # The word this corpus uses for a claim. Both forms are explicit; no
  # pluralization is inferred, because English is unreliable about it.
  claim: claim
  claims: claims
