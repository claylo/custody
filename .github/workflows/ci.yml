name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    # macOS + Homebrew is the only hosted runner with MuPDF and Tesseract inside
    # the supported ranges (README, "Runtime dependencies"). Ubuntu 24.04 apt
    # ships MuPDF 1.23 and Tesseract 5.3, which `custody doctor` rejects.
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # `brew update` first: the runner image's formula snapshot can be weeks
      # old. Current formulae are what local development and the tap install use.
      - name: Install tools and PDF runtime
        env:
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
        run: |
          brew update
          brew install just taplo cargo-nextest cargo-deny mupdf tesseract

      - name: Read Rust versions
        id: versions
        shell: bash
        run: |
          set -euo pipefail
          echo "toolchain=$(taplo get -f rust-toolchain.toml toolchain.channel | tr -d '"')" >> "$GITHUB_OUTPUT"
          echo "msrv=$(taplo get -f Cargo.toml package.rust-version | tr -d '"')" >> "$GITHUB_OUTPUT"

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: ${{ steps.versions.outputs.toolchain }}
          components: clippy,rustfmt

      - name: Install minimum supported Rust version
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: ${{ steps.versions.outputs.msrv }}

      - name: Cache Cargo and build outputs
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: ci

      # Fails fast with versions in the message when brew moves MuPDF or
      # Tesseract outside the supported range, instead of 100+ test failures.
      - name: Check PDF toolchain
        run: just doctor

      - name: Run verification gate
        run: just ci
